# Dockerman Deadline System
services:
  deadlines:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deadlines
    ports:
      - "8080:9999"
    volumes:
      - deadlines-data:/app/data
    environment:
      PORT: 9999
      DATA_DIR: /app/data
    restart: unless-stopped
    develop:
      watch:
        - path: ./app.py
          target: /app/app.py
          action: sync+restart
        - path: ./public
          target: /app/public
          action: sync
        - path: ./Dockerfile
          action: rebuild

volumes:
  deadlines-data:
    driver: local
