# Dockerman Deadline System
services:
  deadlines:
    build: .
    container_name: Dockerman-deadlines
    ports:
      - "9991:9999"
    volumes:
      - deadlines-data:/app/data
    environment:
      - PORT=9999
      - DATA_DIR=/app/data
    restart: unless-stopped
    develop:
      watch:
        - path: ./app.py
          target: /app/app.py
          action: sync+restart
        - path: ./public
          target: /app/public
          action: sync
        - path: ./dockerfile
          action: rebuild

volumes:
  deadlines-data:
    driver: local