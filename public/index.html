<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dockerman • Deadlines</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            dock: {
              950: '#0a0f1a',
              900: '#0f172a',
              800: '#1e293b',
              700: '#334155',
              accent: '#06b6d4',
            }
          },
          animation: {
            'pulse-urgent': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .bar-track {
      height: 6px;
      border-radius: 9999px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
      position: relative;
    }
    .bar-fill {
      height: 100%;
      border-radius: 9999px;
      transition: width 0.8s ease, background-color 0.5s ease;
      box-shadow: 0 0 12px currentColor;
    }
    .tree-line {
      position: relative;
      padding-left: 1.25rem;
    }
    .tree-line::before {
      content: '└─';
      position: absolute;
      left: 0;
      color: #64748b;
      font-family: 'JetBrains Mono', monospace;
    }
    .card {
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }
    .overdue-glow {
      box-shadow: 0 0 0 1px #ef4444, 0 0 20px rgba(239,68,68,0.25);
    }
    .finished-card {
      opacity: 0.65;
      filter: grayscale(0.4);
    }
    .input-error {
      border-color: #f87171 !important;
      box-shadow: 0 0 0 2px rgba(248,113,113,0.25);
    }
  </style>
</head>
<body class="bg-dock-950 text-slate-100 min-h-screen">

  <main class="max-w-6xl mx-auto px-4 py-8">
    <!-- Filtros -->
    <div class="flex gap-2 mb-6">
      <button data-filter="active" class="filter-btn px-4 py-1.5 rounded-full text-sm font-medium bg-cyan-600 text-white">Ativos</button>
      <button data-filter="finished" class="filter-btn px-4 py-1.5 rounded-full text-sm font-medium bg-slate-700 text-slate-300 hover:bg-slate-600">Finalizados</button>
      <button data-filter="all" class="filter-btn px-4 py-1.5 rounded-full text-sm font-medium bg-slate-700 text-slate-300 hover:bg-slate-600">Todos</button>
    </div>

    <!-- Lista de deadlines (barras primeiro) -->
    <div id="list" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3 mb-10">
      <!-- cards renderizados via JS -->
    </div>

    <div id="empty" class="hidden text-center py-20 text-slate-500 mb-10">
      <div class="text-5xl mb-4">📭</div>
      <p class="text-lg">Nenhum deadline cadastrado</p>
      <p class="text-sm mt-1">Adicione o primeiro abaixo</p>
    </div>

     <!-- Form de novo deadline (Fundo da página, idêntico à caixa do rascunho com o botão verde no canto) -->
    <section class="bg-dock-900 border border-slate-800 rounded-xl p-4 shadow-xl my-6">
      <form id="form-new" class="grid grid-cols-1 md:grid-cols-12 gap-3 items-center">
        <div class="md:col-span-4">
          <input type="text" id="new-title" required placeholder="Título "
            class="w-full bg-dock-800 border border-slate-700 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-emerald-500" />
        </div>
        <div class="md:col-span-3">
          <input type="text" id="new-desc" placeholder="Descrição"
            class="w-full bg-dock-800 border border-slate-700 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-emerald-500" />
        </div>
        <div class="md:col-span-3">
          <input type="datetime-local" id="new-due" required
            class="w-full bg-dock-800 border border-slate-700 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-emerald-500 text-slate-300" />
        </div>
        <div class="md:col-span-2">
          <!-- Botão destacado estilo box verde da imagem -->
          <button type="submit"
            class="w-full border-2 border-emerald-400 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 font-medium py-2 rounded-md transition text-sm flex items-center justify-center">
            <span>+ Cadastrar</span>
          </button>
        </div>
        <div class="md:col-span-12 flex flex-wrap items-center gap-2">
          <!-- Membros: um campo para cada -->
          <div id="form-members" class="flex flex-wrap items-center gap-2"></div>
          <button type="button" id="btn-add-form-member"
            class="border border-emerald-400/40 text-emerald-400 hover:bg-emerald-500/10 font-medium px-3 py-2 rounded-md transition text-sm">
            + Membro
          </button>
        </div>
      </form>
    </section>
  </main>

  <!-- Modal de edição -->
  <div id="modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-dock-900 border border-slate-700 rounded-2xl w-full max-w-md p-6 shadow-2xl">
      <h3 class="text-lg font-semibold mb-4">Editar Deadline</h3>
      <form id="form-edit" class="space-y-4">
        <input type="hidden" id="edit-id" />
        <div>
          <label class="block text-xs text-slate-400 mb-1">Título</label>
          <input type="text" id="edit-title" required
            class="w-full bg-dock-800 border border-slate-700 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500/50" />
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Descrição</label>
          <input type="text" id="edit-desc"
            class="w-full bg-dock-800 border border-slate-700 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500/50" />
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Nova data limite</label>
          <input type="datetime-local" id="edit-due" required
            class="w-full bg-dock-800 border border-slate-700 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500/50" />
        </div>
        <div class="flex gap-3 pt-2">
          <button type="button" id="btn-cancel-edit"
            class="flex-1 bg-slate-700 hover:bg-slate-600 py-2.5 rounded-lg text-sm font-medium">Cancelar</button>
          <button type="submit"
            class="flex-1 bg-cyan-600 hover:bg-cyan-500 py-2.5 rounded-lg text-sm font-medium">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal de detalhes com etapas e porcentagem -->
  <div id="modal-details" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-dock-900 border border-slate-700 rounded-2xl w-full max-w-md p-6 shadow-2xl relative">
      <button id="btn-close-details" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg">✕</button>

      <!-- Título principal -->
      <h2 id="detail-title" class="text-2xl font-bold text-white mb-2 mono"></h2>

      <!-- Porcentagem geral do projeto -->
      <div class="flex items-center gap-2 text-lg font-semibold mb-2">
        <span id="detail-member" class="text-red-400 font-bold">Geral</span>
        <span class="text-slate-400">→</span>
        <span id="detail-percent" class="mono text-emerald-400">0%</span>
      </div>

      <!-- Barra geral -->
      <div class="mb-6">
        <div class="bar-track">
          <div id="detail-bar" class="bar-fill" style="width: 0%; background-color: #10b981; color: #10b981;"></div>
        </div>
      </div>

      <!-- Lista de membros (renderizada via JS) -->
      <div id="members-list" class="space-y-4 max-h-72 overflow-y-auto pr-1">
        <!-- Renderizado via JS -->
      </div>

      <!-- Adicionar membro -->
      <div class="mt-5 flex gap-2">
        <input type="text" id="new-member-name" placeholder="Nome do membro"
          class="flex-1 bg-dock-800 border border-slate-700 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-emerald-500" />
        <button id="btn-add-member" type="button"
          class="border-2 border-emerald-400 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 font-medium px-3 py-2 rounded-md transition text-sm whitespace-nowrap">
          + Adicionar
        </button>
      </div>
    </div>
  </div>

  <script>
    // ============ Estado ============
    let deadlines = [];
    let currentFilter = 'active';
    let selectedDeadline = null;

    // ============ API ============
    const API = '/api/deadlines';

    async function fetchDeadlines() {
      const res = await fetch(API);
      if (!res.ok) throw new Error('Falha ao carregar');
      deadlines = await res.json();
      render();
    }

    async function createDeadline(data) {
      const res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.error || 'Erro ao criar');
      }
      return res.json();
    }

    async function updateDeadline(id, data) {
      const res = await fetch(`${API}/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.error || 'Erro ao atualizar');
      }
      return res.json();
    }

    async function deleteDeadline(id) {
      const res = await fetch(`${API}/${id}`, { method: 'DELETE' });
      if (!res.ok) throw new Error('Erro ao excluir');
      return res.json();
    }

    // ============ Tempo & Cores ============
    function parseISO(iso) {
      return new Date(iso);
    }

    function formatRemaining(ms) {
      if (ms <= 0) return { text: 'ATRASADO', overdue: true };
      const s = Math.floor(ms / 1000);
      const days = Math.floor(s / 86400);
      const hours = Math.floor((s % 86400) / 3600);
      const mins = Math.floor((s % 3600) / 60);
      const secs = s % 60;
      let parts = [];
      if (days > 0) parts.push(`${days}d`);
      parts.push(`${String(hours).padStart(2,'0')}h`);
      parts.push(`${String(mins).padStart(2,'0')}m`);
      parts.push(`${String(secs).padStart(2,'0')}s`);
      return { text: parts.join(' '), overdue: false };
    }

    function getUrgency(createdAt, dueAt, now) {
      const created = parseISO(createdAt).getTime();
      const due = parseISO(dueAt).getTime();
      const total = due - created;
      if (total <= 0) return { percent: 0, color: '#ef4444', label: 'Inválido' };

      const remaining = due - now;
      const elapsed = now - created;
      let percent = Math.max(0, Math.min(100, (elapsed / total) * 100));

      // Dias restantes (baseado em quantidade absoluta de dias)
      const daysLeft = remaining / (1000 * 60 * 60 * 24);

      let color, label;
      if (remaining <= 0) {
        color = '#ef4444';
        label = 'Atrasado';
        percent = 100;
      } else if (daysLeft > 30) {
        color = '#22c55e'; // verde
        label = 'Tranquilo';
      } else if (daysLeft > 15) {
        color = '#eab308'; // amarelo
        label = 'Atenção';
      } else if (daysLeft > 7) {
        color = '#f97316'; // laranja
        label = 'Urgente';
      } else {
        color = '#ef4444'; // vermelho
        label = 'Crítico';
      }
      return { percent, color, label };
    }

    function formatDate(iso) {
      if (!iso) return '—';
      const d = parseISO(iso);
      return d.toLocaleString('pt-BR', {
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    }

    // ============ Render ============
    function render() {
      const list = document.getElementById('list');
      const empty = document.getElementById('empty');
      const now = Date.now();

      let filtered = deadlines;
      if (currentFilter === 'active') {
        filtered = deadlines.filter(d => !d.finished_at);
      } else if (currentFilter === 'finished') {
        filtered = deadlines.filter(d => d.finished_at);
      }

      if (filtered.length === 0) {
        list.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      list.innerHTML = filtered.map(d => {
        const isFinished = !!d.finished_at;
        const remaining = formatRemaining(parseISO(d.due_at).getTime() - now);
        const urgency = isFinished
          ? { percent: 100, color: '#64748b', label: 'Finalizado' }
          : getUrgency(d.created_at, d.due_at, now);

        const overdueClass = !isFinished && remaining.overdue ? 'overdue-glow' : '';
        const finishedClass = isFinished ? 'finished-card' : '';
        const progress = isFinished ? 100 : overallPercent(d);
        const barColor = isFinished ? '#64748b' : '#10b981';

        return `
          <div class="card bg-dock-900 border border-slate-800 rounded-lg p-3 ${overdueClass} ${finishedClass} cursor-pointer" data-id="${d.id}" onclick="openDetails(${d.id})">
            <div class="flex items-start justify-between gap-2">
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-1.5 mb-0.5">
                  <h3 class="font-semibold text-sm truncate leading-tight">${escapeHtml(d.title)}</h3>
                  <span class="text-[10px] px-1.5 py-0.5 rounded-full font-medium shrink-0" style="background:${urgency.color}22;color:${urgency.color}">
                    ${urgency.label}
                  </span>
                </div>
                ${d.description ? `<p class="text-xs text-slate-400 mb-1 truncate">${escapeHtml(d.description)}</p>` : ''}
                <div class="flex flex-wrap gap-x-3 gap-y-0.5 text-[10px] text-slate-500 mono">
                  <span>📅 ${formatDate(d.due_at)}</span>
                  ${isFinished ? `<span class="text-emerald-400">✓ ${formatDate(d.finished_at)}</span>` : ''}
                </div>
              </div>

              <div class="text-right shrink-0">
                ${isFinished
                  ? `<div class="text-emerald-400 font-semibold text-xs">CONCLUÍDO</div>`
                  : `<div class="mono text-base font-bold leading-none ${remaining.overdue ? 'text-red-400' : ''}" style="color:${remaining.overdue ? '' : urgency.color}">
                       ${remaining.text}
                     </div>`
                }
              </div>
            </div>

            <!-- Barra de progresso (acompanha a do modal) -->
            <div class="mt-2">
              <div class="flex justify-between text-[10px] text-slate-500 mb-0.5">
                <span>Progresso</span>
                <span class="mono">${progress}%</span>
              </div>
              <div class="bar-track">
                <div class="bar-fill" style="width:${progress}%; background-color:${barColor}; color:${barColor}"></div>
              </div>
            </div>

            <!-- Ações -->
            <div class="mt-2 flex flex-wrap gap-1.5">
              ${!isFinished ? `
                <button onclick="event.stopPropagation(); markFinished(${d.id})" class="text-[10px] px-2 py-1 rounded-md bg-emerald-600/20 text-emerald-400 border border-emerald-600/40 hover:bg-emerald-600/30 transition">
                  ✓ Finalizar
                </button>
                <button onclick="event.stopPropagation(); openEdit(${d.id})" class="text-[10px] px-2 py-1 rounded-md bg-slate-700/50 text-slate-300 border border-slate-600 hover:bg-slate-700 transition">
                  ✎ Editar
                </button>
              ` : `
                <button onclick="event.stopPropagation(); reopen(${d.id})" class="text-[10px] px-2 py-1 rounded-md bg-cyan-600/20 text-cyan-400 border border-cyan-600/40 hover:bg-cyan-600/30 transition">
                  ↺ Reabrir
                </button>
              `}
              <button onclick="event.stopPropagation(); removeDeadline(${d.id})" class="text-[10px] px-2 py-1 rounded-md bg-red-600/10 text-red-400 border border-red-600/30 hover:bg-red-600/20 transition ml-auto">
                🗑
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ============ Modal de detalhes & Etapas ============
    const STEP_WEIGHTS = [10, 20, 30, 25, 15];
    const STEP_NAMES = ['intro', 'work', 'prop', 'results', 'conclusion'];

    function memberPercent(member) {
      const steps = Array.isArray(member.steps) ? member.steps : [];
      return steps.reduce((sum, idx) => sum + (STEP_WEIGHTS[idx] || 0), 0);
    }

    function overallPercent(deadline) {
      const members = (deadline && deadline.members) || selectedDeadline.members || [];
      if (members.length === 0) return 0;
      const avg = members.reduce((sum, m) => sum + memberPercent(m), 0) / members.length;
      return Math.max(0, Math.min(100, Math.round(avg)));
    }

    function openDetails(id) {
      selectedDeadline = deadlines.find(d => d.id === id);
      if (!selectedDeadline) return;

      if (!selectedDeadline.members) selectedDeadline.members = [];
      if (selectedDeadline.members.length === 0 && selectedDeadline.description) {
        selectedDeadline.members = [{ name: selectedDeadline.description, steps: selectedDeadline.steps || [] }];
      }

      document.getElementById('detail-title').innerText = selectedDeadline.title;
      renderMembers();
      document.getElementById('modal-details').classList.remove('hidden');
    }

    function updateOverall() {
      const pct = overallPercent();
      document.getElementById('detail-percent').innerText = `${pct}%`;
      document.getElementById('detail-bar').style.width = `${pct}%`;
    }

    function renderMembers() {
      const container = document.getElementById('members-list');
      const members = selectedDeadline.members || [];

      if (members.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-500 text-center py-3">Nenhum membro — adicione abaixo</p>`;
        updateOverall();
        return;
      }

      container.innerHTML = members.map((m, mi) => {
        const pct = memberPercent(m);
        return `
          <div class="member-block">
            <div class="flex items-center justify-between gap-2 mb-1.5">
              <span class="member-name-text text-red-400 font-bold text-sm truncate">${escapeHtml(m.name)}</span>
              <div class="flex items-center gap-2 shrink-0">
                <span class="mono text-emerald-400 text-sm font-semibold">${pct}%</span>
                <button type="button" onclick="event.stopPropagation(); removeMember(${mi})" class="text-[10px] px-1.5 py-0.5 rounded bg-red-600/10 text-red-400 border border-red-600/30 hover:bg-red-600/20 transition">🗑</button>
              </div>
            </div>
            <div class="space-y-2.5 font-mono text-sm bg-dock-950 p-3 rounded-xl border border-slate-800">
              ${STEP_NAMES.map((name, si) => `
                <label class="flex items-center gap-2 cursor-pointer tree-line hover:text-white transition">
                  <input type="checkbox" data-step="${si}" ${(m.steps || []).includes(si) ? 'checked' : ''}
                    class="member-step rounded bg-dock-800 border-slate-700 text-emerald-500 focus:ring-0" />
                  <span>${name}</span>
                </label>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');
      updateOverall();
    }

    function syncMembersFromDOM() {
      const members = [];
      document.querySelectorAll('#members-list .member-block').forEach(block => {
        const name = block.querySelector('.member-name-text').textContent.trim();
        const steps = [...block.querySelectorAll('.member-step')]
          .filter(cb => cb.checked)
          .map(cb => parseInt(cb.dataset.step))
          .sort((a, b) => a - b);
        members.push({ name, steps });
      });
      selectedDeadline.members = members;
      updateDeadline(selectedDeadline.id, { members }).catch(e => console.log('Não foi possível salvar os membros:', e.message));
    }

    function removeMember(idx) {
      selectedDeadline.members.splice(idx, 1);
      renderMembers();
      syncMembersFromDOM();
    }

    function addMember() {
      const input = document.getElementById('new-member-name');
      const name = input.value.trim();
      if (!name) {
        input.focus();
        input.classList.remove('input-error');
        void input.offsetWidth;
        input.classList.add('input-error');
        setTimeout(() => input.classList.remove('input-error'), 900);
        return;
      }
      selectedDeadline.members.push({ name, steps: [] });
      input.value = '';
      renderMembers();
      syncMembersFromDOM();
    }

    // Delegação de eventos nos checkboxes de etapas
    document.getElementById('members-list').addEventListener('change', (e) => {
      if (e.target && e.target.classList.contains('member-step')) {
        syncMembersFromDOM();
        renderMembers();
      }
    });

    document.getElementById('btn-add-member').addEventListener('click', addMember);
    document.getElementById('new-member-name').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        addMember();
      }
    });

    document.getElementById('btn-close-details').addEventListener('click', () => {
      document.getElementById('modal-details').classList.add('hidden');
    });

    // ============ Ações ============
    async function markFinished(id) {
      try {
        await updateDeadline(id, { finished: true });
        await fetchDeadlines();
      } catch (e) {
        alert(e.message);
      }
    }

    async function reopen(id) {
      try {
        await updateDeadline(id, { finished: false });
        await fetchDeadlines();
      } catch (e) {
        alert(e.message);
      }
    }

    async function removeDeadline(id) {
      if (!confirm('Excluir este deadline permanentemente?')) return;
      try {
        await deleteDeadline(id);
        await fetchDeadlines();
      } catch (e) {
        alert(e.message);
      }
    }

    function openEdit(id) {
      const d = deadlines.find(x => x.id === id);
      if (!d) return;
      document.getElementById('edit-id').value = id;
      document.getElementById('edit-title').value = d.title;
      document.getElementById('edit-desc').value = d.description || '';
      // datetime-local precisa de formato local sem Z
      const due = parseISO(d.due_at);
      const local = new Date(due.getTime() - due.getTimezoneOffset() * 60000)
        .toISOString().slice(0, 16);
      document.getElementById('edit-due').value = local;
      document.getElementById('modal').classList.remove('hidden');
    }

    // ============ Eventos ============
    function addFormMember(name = '') {
      const container = document.getElementById('form-members');
      const row = document.createElement('div');
      row.className = 'flex items-center gap-2';
      row.innerHTML = `
        <input type="text" value="${escapeHtml(name)}" placeholder="Membro"
          class="member-name w-44 bg-dock-800 border border-slate-700 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-emerald-500" />
        <button type="button" onclick="this.parentElement.remove()"
          class="text-slate-500 hover:text-red-400 transition text-sm" title="Remover membro">✕</button>
      `;
      container.appendChild(row);
      row.querySelector('input').focus();
    }

    function resetFormMembers() {
      document.getElementById('form-members').innerHTML = '';
      addFormMember();
    }

    document.getElementById('btn-add-form-member').addEventListener('click', () => addFormMember());

    document.getElementById('form-new').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('new-title').value.trim();
      const description = document.getElementById('new-desc').value.trim();
      const dueLocal = document.getElementById('new-due').value;
      if (!title || !dueLocal) return;

      // Converte datetime-local para ISO UTC
      const due = new Date(dueLocal).toISOString();

      const members = [...document.querySelectorAll('#form-members .member-name')]
        .map(i => i.value.trim())
        .filter(Boolean)
        .map(name => ({ name, steps: [] }));

      try {
        await createDeadline({ title, description, due_at: due, members });
        document.getElementById('form-new').reset();
        resetFormMembers();
        await fetchDeadlines();
      } catch (err) {
        alert(err.message);
      }
    });

    document.getElementById('form-edit').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = parseInt(document.getElementById('edit-id').value);
      const title = document.getElementById('edit-title').value.trim();
      const description = document.getElementById('edit-desc').value.trim();
      const dueLocal = document.getElementById('edit-due').value;
      const due = new Date(dueLocal).toISOString();

      try {
        await updateDeadline(id, { title, description, due_at: due });
        document.getElementById('modal').classList.add('hidden');
        await fetchDeadlines();
      } catch (err) {
        alert(err.message);
      }
    });

    document.getElementById('btn-cancel-edit').addEventListener('click', () => {
      document.getElementById('modal').classList.add('hidden');
    });

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentFilter = btn.dataset.filter;
        document.querySelectorAll('.filter-btn').forEach(b => {
          b.classList.remove('bg-cyan-600', 'text-white');
          b.classList.add('bg-slate-700', 'text-slate-300');
        });
        btn.classList.remove('bg-slate-700', 'text-slate-300');
        btn.classList.add('bg-cyan-600', 'text-white');
        render();
      });
    });

    // Continuous update (a cada 1s)
    function tick() {
      render(); // re-render para atualizar barras e tempos
    }

    // Init
    resetFormMembers();
    fetchDeadlines().then(() => {
      tick();
      setInterval(tick, 1000);
    }).catch(err => {
      console.error(err);
      document.getElementById('list').innerHTML = `<p class="text-red-400">Erro ao conectar com a API. Verifique se o servidor está rodando.</p>`;
    });
  </script>
</body>
</html>
